<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src quicklook-resource:; connect-src 'none'; frame-src quicklook-app://bundle/document/; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>OrbisPeek</title>
    <link rel="stylesheet" href="styles.css">
    <script src="renderer.js" defer></script>
  </head>
  <body class="empty wrap-lines">
    <header class="toolbar">
      <div class="document-info">
        <h1 id="file-name" class="visually-hidden" aria-describedby="file-description"><span id="file-basename">选择文件以预览</span><span id="file-extension"></span></h1>
        <div id="file-meta" class="file-meta" aria-hidden="true">
          <span class="meta-format"><span id="format-label"></span><span class="meta-separator">·</span></span>
          <span class="meta-encoding"><span id="file-encoding"></span><span class="meta-separator">·</span></span>
          <span id="file-size"></span>
          <span class="meta-count"><span class="meta-separator">·</span><span id="file-count"></span></span>
        </div>
        <span id="file-description" class="visually-hidden">Markdown、数据、配置与源码预览</span>
      </div>
      <nav class="actions" aria-label="预览选项">
        <button id="source-toggle" class="icon-button" type="button" aria-pressed="false" title="查看原文" aria-label="查看原文">
          <svg class="source-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></svg>
          <svg class="preview-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="wrap-toggle" class="icon-button" type="button" aria-pressed="true" title="切换长行自动换行" aria-label="切换长行自动换行">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h18M3 10h13a4 4 0 0 1 0 8h-4m3-3-3 3 3 3M3 15h4M3 20h4"/></svg>
        </button>
      </nav>
    </header>
    <aside id="notices" class="notices" role="status" hidden></aside>
    <main id="content" tabindex="0" aria-label="文件预览"><div class="empty-state">按下空格，直接阅读。</div></main>
  </body>
</html>
