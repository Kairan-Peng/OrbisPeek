name: Quicklook
options:
  bundleIdPrefix: org.quicklook
  deploymentTarget:
    macOS: "15.0"
packages:
  Quicklook:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "12"
    QUICKLOOK_APP_GROUP: ""
targets:
  Quicklook:
    type: application
    platform: macOS
    sources:
      - App
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: OrbisPeek
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        QuicklookAppGroup: "$(QUICKLOOK_APP_GROUP)"
        QuicklookBuildConfiguration: "$(CONFIGURATION)"
        NSHumanReadableCopyright: "Copyright 2026 OrbisPeek contributors"
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: org.quicklook.preview.image-access
            CFBundleURLSchemes: [orbispeek]
    settings:
      base:
        PRODUCT_NAME: OrbisPeek
        PRODUCT_BUNDLE_IDENTIFIER: org.quicklook.preview
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
    dependencies:
      - target: QuicklookPreview
        embed: true
      - package: Quicklook
        product: QuicklookUI
  QuicklookPreview:
    type: app-extension
    platform: macOS
    sources:
      - Extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.quicklook.preview.extension
        INFOPLIST_FILE: Config/Preview-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Preview.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: Quicklook
        product: QuicklookUI
schemes:
  Quicklook:
    build:
      targets:
        Quicklook: all
